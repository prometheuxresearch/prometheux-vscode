# Checks every push and pull request: typecheck, unit + language-server tests, build, package,
# and the accounts / Palantir Foundry suite in a real VS Code (against a fake Foundry, so it needs
# no secrets). Run locally: the Prometheux suite (test:integration, needs a live backend) and
# check:dialect (a coverage count of the Prometheux dialect, not a pass / fail check yet).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Accounts and Foundry suite (real VS Code, fake Foundry)
        run: xvfb-run -a npm run test:foundry
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: build/*.vsix
